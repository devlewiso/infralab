<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0c"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Red glow effects -->
  <circle cx="1000" cy="100" r="300" fill="#dc2626" opacity="0.15"/>
  <circle cx="200" cy="500" r="250" fill="#be123c" opacity="0.12"/>
  
  <!-- Main title -->
  <text x="60" y="280" font-family="monospace" font-size="72" font-weight="bold" fill="#ffffff">
    INFRA.LAB
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="340" font-family="monospace" font-size="28" fill="#ef4444">
    Production-Grade Homelab
  </text>
  
  <!-- Tagline -->
  <text x="60" y="400" font-family="monospace" font-size="20" fill="#71717a">
    Proxmox • Zero-Trust • AI Infrastructure
  </text>
  
  <!-- Decorative elements -->
  <rect x="60" y="440" width="200" height="2" fill="#ef4444"/>
  
  <!-- Status indicator -->
  <circle cx="60" cy="80" r="8" fill="#ef4444"/>
  <text x="80" y="86" font-family="monospace" font-size="16" fill="#71717a">
    SYSTEMS ONLINE
  </text>
  
  <!-- URL -->
  <text x="60" y="580" font-family="monospace" font-size="18" fill="#52525b">
    infra.neuralcodelab.com
  </text>
</svg>
